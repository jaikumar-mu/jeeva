<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWP CAD Tools — www.swpcad.in</title>
<style>
  :root {
    --bg: #f5f6f7;
    --panel: #ffffff;
    --line: #e2e8f0;
    --text: #1a1a2e;
    --dim: #64748b;
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --sidebar-w: 200px;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: var(--sans); color: var(--text); background: var(--bg); }
  .layout { display: flex; height: 100vh; }

  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-brand { padding: 14px 12px 10px; border-bottom: 1px solid var(--line); }
  .sidebar-brand-name { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; }
  .sidebar-brand-sub { font-size: 10px; color: var(--dim); margin-top: 2px; line-height: 1.4; }
  .sidebar-section { padding: 10px 12px 4px; font-size: 10px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); }

  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; font-size: 12px; color: var(--dim);
    cursor: pointer; border-left: 3px solid transparent;
    transition: all 0.15s; text-decoration: none; user-select: none;
  }
  .nav-item:hover { background: var(--accent-bg); color: var(--accent); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); border-left-color: var(--accent); font-weight: 500; }
  .nav-icon { font-size: 15px; flex-shrink: 0; }
  .nav-label { line-height: 1.3; flex: 1; }
  .nav-badge { font-size: 9px; padding: 1px 5px; border-radius: 10px; margin-left: auto; flex-shrink: 0; }
  .badge-free { background: #dcfce7; color: #166534; }
  .badge-lic { background: #fef3c7; color: #92400e; }

  .sidebar-footer {
    margin-top: auto; padding: 10px 12px;
    border-top: 1px solid var(--line);
    font-size: 10px; color: var(--dim); line-height: 1.6;
  }
  .sidebar-footer a { color: #dc2626; text-decoration: none; font-weight: 500; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .topbar {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .topbar-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .topbar-url { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: auto; }

  .frame-area { flex: 1; position: relative; min-height: 0; }
  .tool-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; }
  .tool-frame.active { display: block; }
</style>
</head>
<body>
<div class="layout">

  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-name">SWP CAD Tools</div>
      <div class="sidebar-brand-sub">TNCDBR 2019<br>www.swpcad.in</div>
    </div>

    <div class="sidebar-section">Main Tool</div>
    <div class="nav-item active" onclick="loadTool('v36_PER_SHEET_FSI_LIVE_UPDATE_33_.html', this, 'Online Self Certification')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Online Self Certification</span>
      <span class="nav-badge badge-lic">Paid</span>
    </div>
